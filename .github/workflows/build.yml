name: Build repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin.video.redlight/**"
      - "repo/**"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: samlight-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "samlight-bot"
          git config user.email "actions@github.com"

      - name: Build repository
        run: python tools/build.py

      - name: Commit and push
        run: |
          git add -A docs
          if git diff --cached --quiet && git diff --quiet HEAD; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Rebuild repository [skip ci]" || true
          git push origin main
